<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager — Charlizi Factory</title>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
    DecapCMS.init({
      config: {
        backend: {
          name: 'github',
          repo: 'charliziofficial-droid/charlizi-site',
          branch: 'main',
          base_url: 'https://api.github.com',
          auth_endpoint: 'https://charlizi-site.vercel.app/api/auth',
        },
        local_backend: true,
        media_folder: 'public/images',
        public_folder: '/images',
        collections: [
          {
            name: 'site', label: '网站基本信息',
            files: [
              { name: 'content', label: '站点内容', file: 'src/data/site-content.json',
                fields: [
                  { label: '品牌名称', name: 'brandName', widget: 'string' },
                  { label: '品牌副标题', name: 'brandTagline', widget: 'string' },
                  { label: '首页大标题', name: 'heroTitle', widget: 'text' },
                  { label: '首页副标题', name: 'heroSubtitle', widget: 'text' },
                  { label: '首页标语', name: 'heroTagline', widget: 'string' },
                  { label: 'Logo SVG路径', name: 'logoSvg', widget: 'text' },
                  { label: '工人数', name: 'workers', widget: 'string' },
                  { label: '工厂面积', name: 'area', widget: 'string' },
                  { label: '年产量', name: 'annualOutput', widget: 'string' },
                  { label: '月出货量', name: 'monthlyContainers', widget: 'string' },
                  { label: '成立年份', name: 'founded', widget: 'string' },
                ]
              },
              { name: 'images', label: '图片', file: 'src/data/images.json',
                fields: [
                  { label: '首页大图', name: 'heroImage', widget: 'image' },
                  { label: '默认产品图', name: 'defaultImage', widget: 'image' },
                ]
              },
            ]
          },
          {
            name: 'products', label: '产品管理', files: [{
              name: 'categories', label: '产品分类', file: 'src/data/products.json',
              fields: [{ label: '分类列表', name: 'categories', widget: 'list', fields: [
                { label: 'ID', name: 'id', widget: 'string' },
                { label: '名称', name: 'name', widget: 'string' },
                { label: 'URL标识', name: 'slug', widget: 'string' },
                { label: '描述', name: 'description', widget: 'text' },
                { label: '图片', name: 'image', widget: 'image', required: false },
                { label: '子分类', name: 'subCategories', widget: 'text' },
                { label: '规格', name: 'specs', widget: 'text' },
                { label: 'MOQ', name: 'moq', widget: 'string' },
                { label: '交期', name: 'leadTime', widget: 'string' },
                { label: '标签1', name: 'badge1', widget: 'string' },
                { label: '标签2', name: 'badge2', widget: 'string' },
              ]}]
            }]
          },
          {
            name: 'faq', label: 'FAQ', file: 'src/data/faq.json',
            fields: [
              { label: '标题', name: 'title', widget: 'string' },
              { label: '问答', name: 'items', widget: 'list', fields: [
                { label: '问题', name: 'q', widget: 'string' },
                { label: '答案', name: 'a', widget: 'markdown' },
              ]}
            ]
          },
          {
            name: 'stats', label: '统计数据', file: 'src/data/stats.json',
            fields: [
              { label: '标题', name: 'title', widget: 'string' },
              { label: '标语', name: 'tagline', widget: 'string' },
              { label: '统计项', name: 'stats', widget: 'list', fields: [
                { label: '数字', name: 'amount', widget: 'string' },
                { label: '名称', name: 'title', widget: 'string' },
                { label: '描述', name: 'desc', widget: 'string' },
              ]}
            ]
          },
          {
            name: 'post', label: '博客文章', folder: 'src/content/post', create: true,
            fields: [
              { label: '标题', name: 'title', widget: 'string' },
              { label: '日期', name: 'date', widget: 'datetime', format: 'YYYY-MM-DD' },
              { label: '封面图', name: 'image', widget: 'image', required: false },
              { label: '摘要', name: 'excerpt', widget: 'text' },
              { label: '正文', name: 'body', widget: 'markdown' },
            ]
          },
        ],
      },
    });
    </script>
  </body>
</html>
