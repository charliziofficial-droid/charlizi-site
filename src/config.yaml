site:
  name: Charlizi Factory
  site: 'https://charlizi.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: Charlizi Factory
    template: '%s | Charlizi Factory'
  description: "Intimate Apparel OEM/ODM Manufacturer — Lingerie, shapewear, bras & panties. BSCI & OEKO-TEX certified. 200+ workers, 5,000㎡ facility."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Charlizi Factory
    images:
      - url: '/factory/images/og-factory-default.jpg'
        width: 1200
        height: 628
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 6
    post:
      isEnabled: false
      permalink: '/blog/%slug%'
      robots:
        index: true
    list:
      isEnabled: false
      pathname: 'blog'
      robots:
        index: true
    category:
      isEnabled: false
      pathname: 'category'
      robots:
        index: true
    tag:
      isEnabled: false
      pathname: 'tag'
      robots:
        index: false
    isRelatedPostsEnabled: false
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'light:only'
